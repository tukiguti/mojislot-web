<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320">
  <!--
    コトハ（素体）。クイズの出題者。島ごとに衣装だけ差し替える。

    重ね順は base → outfit → face の3枚。全部この viewBox で揃えるので位置合わせは自動。
    ここには**衣装で隠れない部分**だけを描く（髪・顔・首・素の上半身）。

    作風はリール図柄と揃えて太い黒フチ＋平塗り（16章のステッカー調）。
    暗い液晶に置くので髪と肌は明るい側に寄せる。

    **CSSクラスを使わず属性で書く**——ImageMagick の内蔵レンダラなど CSS を
    解釈しない環境があり、輪郭線が丸ごと消える。属性ならどこでも同じに出る。

    形の決めごと（初稿から直した点）:
    - 胴は**肩の傾斜**を作る。丸い塊にすると「白い便座」に見えて顔が主役でなくなる
    - 腕は胴とは別の輪郭で描き、肩から下ろす。胴と一体だと横の出っ張りにしか見えない
    - 後ろ髪の毛先は腕より**上**で終わらせる。同じ高さだと団子になって区別がつかない
    - 首は短く細く。四角がそのまま見えると人形っぽくなる
  -->

  <!-- ── 後ろ髪。肩より広く張り出させて三角形に近い安定したシルエットにする ── -->
  <g stroke="#1e1712" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <path fill="#c9913f" d="
      M120 38
      C 70 38, 40 74, 40 122
      C 40 148, 36 172, 32 192
      C 28 212, 40 226, 56 222
      C 70 219, 80 206, 84 190
      L 156 190
      C 160 206, 170 219, 184 222
      C 200 226, 212 212, 208 192
      C 204 172, 200 148, 200 122
      C 200 74, 170 38, 120 38 Z" />
    <!-- 毛先。腕（y214以下）より上で終わらせ、先を尖らせて「毛」と読ませる -->
    <path fill="#e8b563" d="M44 168 C 26 180, 18 204, 24 222 C 30 238, 50 236, 56 220 C 61 206, 55 182, 44 168 Z" />
    <path fill="#e8b563" d="M196 168 C 214 180, 222 204, 216 222 C 210 238, 190 236, 184 220 C 179 206, 185 182, 196 168 Z" />
  </g>

  <!-- ── 首。短く細く。あごの影で繋ぎを隠す ── -->
  <g stroke="#1e1712" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <path fill="#f3c6a8" d="M110 152 L130 152 L130 182 L110 182 Z" />
  </g>

  <!-- ── 胴。肩の傾斜を作る。衣装が上に乗るので下地は無地 ── -->
  <g stroke="#1e1712" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <path fill="#f5f3ec" d="
      M120 176
      C 104 176, 92 182, 84 194
      C 78 203, 74 212, 72 222
      C 68 250, 66 286, 66 320
      L 174 320
      C 174 286, 172 250, 168 222
      C 166 212, 162 203, 156 194
      C 148 182, 136 176, 120 176 Z" />
    <!-- 襟。肩のラインを1本足すだけで「服を着ている」に見える -->
    <path fill="none" stroke-width="4" d="M96 186 C 106 196, 134 196, 144 186" />
  </g>

  <!-- ── 腕。胴とは別の輪郭で、肩から下ろす ── -->
  <g stroke="#1e1712" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <path fill="#efece3" d="M84 196 C 72 208, 64 240, 62 276 C 61 292, 78 294, 80 278 C 84 244, 88 216, 96 202 Z" />
    <path fill="#efece3" d="M156 196 C 168 208, 176 240, 178 276 C 179 292, 162 294, 160 278 C 156 244, 152 216, 144 202 Z" />
    <!-- 手。丸を1つ置くだけで腕の終端が決まる -->
    <circle fill="#ffe2cc" cx="72" cy="280" r="13" />
    <circle fill="#ffe2cc" cx="168" cy="280" r="13" />
  </g>

  <!-- ── 顔。耳は髪の手前に少しだけ覗かせる ── -->
  <g stroke="#1e1712" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <ellipse fill="#ffe2cc" cx="60"  cy="120" rx="10" ry="13" />
    <ellipse fill="#ffe2cc" cx="180" cy="120" rx="10" ry="13" />
    <ellipse fill="#ffe2cc" cx="120" cy="110" rx="60" ry="58" />
  </g>

  <!-- ── 前髪。ぱっつんを3つの丸い毛先で。中央に突起を作らない ── -->
  <g stroke="#1e1712" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <path fill="#e8b563" d="
      M60 114
      C 58 72, 80 42, 120 42
      C 160 42, 182 72, 180 114
      C 175 98, 166 90, 156 93
      C 146 96, 139 105, 134 114
      C 130 101, 125 93, 118 93
      C 111 93, 104 101, 100 114
      C 94 104, 86 95, 77 97
      C 69 99, 63 105, 60 114 Z" />
    <path fill="none" stroke="#f7d9a0" stroke-width="4" d="M98 54 C 82 62, 72 76, 68 92" />
  </g>

  <!-- ── リボン。左耳の上。女の子だと一目で分かる印で、衣装の色に合わせて差し替えられる ── -->
  <g stroke="#1e1712" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
    <path fill="#e05a6d" d="M54 74 C 38 62, 24 70, 28 84 C 31 96, 46 96, 54 88 Z" />
    <path fill="#e05a6d" d="M54 74 C 62 58, 78 58, 80 72 C 82 84, 68 92, 58 88 Z" />
    <circle fill="#ff8a99" cx="56" cy="81" r="7" />
  </g>
</svg>

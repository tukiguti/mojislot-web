<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320">
  <!--
    出題（？）。「これ分かる？」の顔。眉を上げ、目を見開き、口を小さく開ける。

    表情差は**形そのものを変える**。旧ジンは目のサイズを 6/8/9px で描き分けていて、
    直径180pxの中の数pxは離れると読めなかった（33章）。眉・目・口の3つを全部動かす。
    CSSクラスは使わない（属性で書く。理由は base.svg のコメント参照）。
  -->

  <!-- 眉：上げる（＝問いかけ） -->
  <g fill="none" stroke="#1e1712" stroke-width="5" stroke-linecap="round">
    <path d="M76 78 C 84 70, 100 68, 110 74" />
    <path d="M164 78 C 156 70, 140 68, 130 74" />
  </g>

  <!-- 目：見開き。白目→虹彩→瞳→ハイライトの4層 -->
  <g stroke="#1e1712" stroke-width="4.5" stroke-linejoin="round">
    <ellipse fill="#ffffff" cx="93"  cy="118" rx="17" ry="21" />
    <ellipse fill="#ffffff" cx="147" cy="118" rx="17" ry="21" />
  </g>
  <ellipse fill="#3b6ea5" cx="93"  cy="120" rx="12" ry="16" />
  <ellipse fill="#3b6ea5" cx="147" cy="120" rx="12" ry="16" />
  <ellipse fill="#16243a" cx="93"  cy="121" rx="6"  ry="9" />
  <ellipse fill="#16243a" cx="147" cy="121" rx="6"  ry="9" />
  <circle fill="#ffffff" cx="88"  cy="112" r="5" />
  <circle fill="#ffffff" cx="142" cy="112" r="5" />
  <circle fill="#ffffff" cx="98"  cy="128" r="2.4" />
  <circle fill="#ffffff" cx="152" cy="128" r="2.4" />

  <!-- ほお -->
  <ellipse fill="#ff9a9a" opacity="0.55" cx="70"  cy="140" rx="13" ry="8" />
  <ellipse fill="#ff9a9a" opacity="0.55" cx="170" cy="140" rx="13" ry="8" />

  <!-- 口：小さく開ける -->
  <ellipse fill="#7a2f36" stroke="#1e1712" stroke-width="3.5" cx="120" cy="150" rx="9" ry="11" />

  <!--
    「？」。出題中だと一目で分かる印。**フォントではなくパスで描く**——
    テキストだと環境にフォントが無い時に消える（Pixi のラスタライズ先に
    ヒラギノがある保証はない）。
  -->
  <g transform="translate(206 54) rotate(12)">
    <path fill="none" stroke="#1e1712" stroke-width="19" stroke-linecap="round"
          d="M-14 -18 C -14 -36, 16 -38, 16 -18 C 16 -6, 1 -3, 1 9" />
    <circle fill="#1e1712" cx="1" cy="26" r="9.5" />
    <path fill="none" stroke="#ffd45e" stroke-width="9" stroke-linecap="round"
          d="M-14 -18 C -14 -36, 16 -38, 16 -18 C 16 -6, 1 -3, 1 9" />
    <circle fill="#ffd45e" cx="1" cy="26" r="5" />
  </g>
</svg>

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="%BASE_URL%favicon-256.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文字スロ ―MOJISLOT―</title>
    <meta
      name="description"
      content="3文字の日本語を目押しで揃えるパチスロ風ゲーム。設定は無い。あるのは腕だけ。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="文字スロ ―MOJISLOT―" />
    <meta
      property="og:description"
      content="3文字の日本語を目押しで揃えるパチスロ風ゲーム。設定は無い。あるのは腕だけ。"
    />
    <meta
      property="og:image"
      content="https://tukiguti.github.io/mojislot-web/og-image.png"
    />
    <meta property="og:url" content="https://tukiguti.github.io/mojislot-web/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="view-play" class="view" hidden></div>
    <div id="view-game" class="view game-view" hidden>
    <!-- 脇のパネル（左＝リール配列・右＝サンド）。縦長ではシートへ畳む。 -->
    <aside id="reel-strip-panel">
      <button class="strip-close" type="button" hidden>×</button>
      <h3>リール配列</h3>
      <div class="strip-grid">
        <div class="strip-column" data-reel="0">
          <h4>左</h4>
          <div class="cells"></div>
        </div>
        <div class="strip-column" data-reel="1">
          <h4>中</h4>
          <div class="cells"></div>
        </div>
        <div class="strip-column" data-reel="2">
          <h4>右</h4>
          <div class="cells"></div>
        </div>
      </div>
      <div class="strip-hint">停止時に中央セルをハイライトします</div>
    </aside>

    <div id="unit-column">
    <aside id="unit-panel">
      <div class="unit-head">UNIT</div>
      <div id="unit-live">
        <div class="unit-readout">
          <span class="unit-readout-label">差枚</span>
          <span class="unit-readout-num" id="unit-medal">0</span>
        </div>
        <div class="unit-stat">
          <div class="unit-stat-row">
            <span class="unit-stat-label">投資</span>
            <span class="unit-stat-num" id="unit-invest">0</span>
          </div>
          <div class="unit-stat-row">
            <span class="unit-stat-label">回収</span>
            <span class="unit-stat-num" id="unit-payback">0</span>
          </div>
        </div>
      </div>
      <div class="unit-timer">
        <div class="unit-timer-top">
          <span class="unit-stat-label">時間計測</span>
          <span class="unit-timer-clock" id="timer-elapsed">00:00</span>
        </div>
        <div class="unit-timer-presets" id="timer-presets">
          <button class="timer-preset active" data-min="0" type="button">フリー</button>
          <button class="timer-preset" data-min="1" type="button">1分</button>
          <button class="timer-preset" data-min="3" type="button">3分</button>
          <button class="timer-preset" data-min="5" type="button">5分</button>
          <button class="timer-preset" data-min="10" type="button">10分</button>
        </div>
        <div class="unit-timer-rates">
          <div class="unit-timer-rate">
            <span class="unit-timer-rate-label">分速</span>
            <span class="unit-timer-rate-num" id="timer-min">—</span>
          </div>
          <div class="unit-timer-rate">
            <span class="unit-timer-rate-label">区間差枚</span>
            <span class="unit-timer-rate-num" id="timer-total">—</span>
          </div>
        </div>
        <div class="unit-timer-buttons">
          <button id="timer-toggle" class="aux-btn" type="button">計測開始</button>
          <button id="timer-reset" class="aux-btn" type="button" title="計測をリセット">リセット</button>
        </div>
      </div>
      <div class="unit-hint">計数は操作部の右端</div>
    </aside>
    </div>


    <!-- 筐体とドックで1本の柱。ドックは筐体の続き（台のメニュー）なので、
         浮かせずに下皿の直下へ貼り付ける。縦長だけは画面下へ固定する。 -->
    <div id="machine-column">
      <!-- データランプ＝筐体の上に載る別体の表示器。ホールの台選びと同じ数字を、
           座って打っている間も出す。中身は DataLamp.ts が描く。 -->
      <div id="datalamp" aria-label="データカウンター"></div>
    <div id="cabinet">
      <!-- 筐体の並びは実機に合わせてある（仕様18 §実機の並びへ組み直す）。
           上から トップランプ／タイトルパネル／液晶＋リール窓／情報パネル／
           操作部／下パネル／下皿。ホールの台選びで見えている筐体と同じ構造。 -->
      <div id="toplamp" aria-hidden="true"></div>
      <div id="masthead">
        <button id="home-btn" type="button" title="ホールへ戻る" aria-label="ホールへ戻る">≡</button>
        <span class="mark" id="machine-title">mojislot</span>
        <div class="masthead-tools">
          <button id="auto-btn" type="button" title="オート [O]">AUTO</button>
          <button id="mute-btn" type="button" title="音量 [M]">♪</button>
          <button id="zukan-btn" type="button" title="図鑑 [Z]" hidden>図鑑</button>
          <button id="settings-btn" type="button" title="設定 [,]" hidden>⚙</button>
        </div>
      </div>

      <div id="game-area">
        <canvas id="game"></canvas>
        <!-- 進行ステータスは演出液晶の左上に出す（ヘッダーを溢れさせない） -->
        <div id="lcd-status">
          <!-- リミックス島だけ出す。いま何の配列を打っているかが常時見えていないと、
               ボーナス終了時の一瞬の告知を見逃した人に手掛かりが残らない -->
          <div id="stage-status" hidden></div>
          <div id="bonus-status" hidden></div>
          <div id="streak-status" hidden></div>
          <div id="rescue-status" hidden></div>
        </div>
        <div id="result-display"></div>
      </div>

      <div id="overlays">
        <div id="zukan-overlay" hidden></div>
        <div id="settings-overlay" hidden></div>
        <div id="bonus-banner" hidden></div>
      </div>

      <!-- 情報パネル＝リール直下の計器。実機はここに CREDIT と 払出 の7セグ、
           間に REPLAY / START / BET のランプが並ぶ。以前は液晶の上にヘッダーとして
           置いていたが、実機に上部の情報帯は無い。 -->
      <div class="header-shell">
        <header id="info-bar">
          <div class="ip-meter">
            <span class="ip-label">差枚</span>
            <span class="ip-value" id="coin-display">0</span>
          </div>
          <div class="ip-lamps" id="status-stack">
            <span class="ip-lamp" id="bet-text">BET 3</span>
            <div id="effect-status">通常</div>
          </div>
          <div class="ip-meter ip-meter-right">
            <span class="ip-label">払出</span>
            <span class="ip-value" id="payout-display">0</span>
          </div>
        </header>
      </div>

      <footer id="control-panel">
        <!-- 左のデッキ：MAXBET の上にレバー。実機はレバーが左端で、その内側に
             BET が並ぶ。ストップは下の .stop-row がリールの真下へ絶対配置する。 -->
        <div class="deck-well">
          <button id="bet-btn" data-key="[B]">MAX<span>BET</span></button>
          <button id="lever-btn" data-key="[Space]" aria-label="レバー">
            <span class="lever-ball" aria-hidden="true"></span>
            <span class="lever-rod" aria-hidden="true"></span>
          </button>
        </div>
        <div class="stop-row" id="reel-buttons">
          <button class="stop-btn" data-reel="0" data-key="[A]">STOP</button>
          <button class="stop-btn" data-reel="1" data-key="[S]">STOP</button>
          <button class="stop-btn" data-reel="2" data-key="[D]">STOP</button>
        </div>
        <!-- 計数＝この戦を締める。操作部の右端に1つだけ置く。
             以前はドックにも同じものがあり、名前だけ「精算」と違っていた。 -->
        <div class="settle-well">
          <button id="settle-btn" type="button">計数</button>
        </div>
        <div id="key-hint">Space:レバー  /  A・S・D:ストップ  /  B:BET  /  1〜4:クイズ</div>
      </footer>

      <!-- 下パネル＝ロゴ板。スピーカーグリル（筐体ランプ）はここで左右に付く。
           実機の下部スピーカーの位置で、ロゴを挟む形になる。 -->
      <div id="lowerpanel">
        <div class="cabinet-lamp" data-side="left" aria-hidden="true"></div>
        <span class="lower-mark">MOJISLOT</span>
        <div class="cabinet-lamp" data-side="right" aria-hidden="true"></div>
      </div>
      <div id="tray" aria-hidden="true"></div>
    </div>

      <nav id="dock" aria-label="メニュー">
        <button class="dock-btn" id="dock-reels" type="button">
          <span class="dock-icon" aria-hidden="true">▤</span><span class="dock-label">配列</span>
        </button>
        <button class="dock-btn" id="dock-unit" type="button">
          <span class="dock-icon" aria-hidden="true">▦</span><span class="dock-label">データ</span>
        </button>
        <button class="dock-btn" id="dock-zukan" type="button">
          <span class="dock-icon" aria-hidden="true">▣</span><span class="dock-label">図鑑</span>
        </button>
        <button class="dock-btn" id="dock-settings" type="button">
          <span class="dock-icon" aria-hidden="true">⚙</span><span class="dock-label">設定</span>
        </button>
      </nav>
    </div>
    </div>

    <div id="view-ranking" class="view" hidden></div>
    <div id="view-card" class="view" hidden></div>

    <script type="module" src="/src/main-entry.ts"></script>
  </body>
</html>
